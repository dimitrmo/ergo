[package]
name = "ergo-nodes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
croner = "4.0.0"
ergo-core = { version = "0.0.3", path = "../ergo-core" }
futures-util = "0.3.34"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "form", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }

serde_json = "1.0.151"
serde_json_path = "0.7.2"
jsonata-core = { version = "2.2.10", default-features = false }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
webpki-roots = "1.0.9"

[dev-dependencies]
wiremock = "0.6.5"
