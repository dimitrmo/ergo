# ergo: static UI + reverse proxy to the backend on 127.0.0.1:8100.

server {
    listen 8099 default_server;

    # Home Assistant Ingress (and the container healthcheck) only. HA's own
    # login is the only way in.
    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    root /usr/share/ergo/ui;
    index index.html;

    # Fingerprinted by Vite: cache forever.
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/(api/|health$|ready$) {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_read_timeout 60s;
    }

    # The app routes on the client (hash URLs), so everything else is the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
