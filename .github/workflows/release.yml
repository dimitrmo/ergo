name: Release

# Tag vX.Y.Z after setting the same version in addon/config.yaml and adding a
# CHANGELOG.md section for it. This builds and pushes both images to GHCR and
# creates the GitHub release; HA then shows "Update available".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          config=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)
          if [ "$tag" != "$config" ]; then
            echo "::error::tag $tag doesn't match addon/config.yaml version $config"; exit 1
          fi
          if ! grep -q "^## $tag\$" addon/CHANGELOG.md; then
            echo "::error::addon/CHANGELOG.md has no '## $tag' section"; exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.arch }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make addon ARCH=${{ matrix.arch }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-addon-ergo" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: build/addon-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.check.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  github-release:
    name: GitHub release
    needs: [check, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        run: |
          awk -v v="## ${{ needs.check.outputs.version }}" '$0==v{f=1;next} /^## /{f=0} f' addon/CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
