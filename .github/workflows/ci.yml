name: CI

# Every green push to master is released: CI bumps the version in Cargo, npm
# and the add-on config (patch, or #minor / #major in a commit message), commits
# that as "Release X.Y.Z [skip ci]", pushes both images to GHCR, then tags the
# commit and creates the GitHub release, and HA shows "Update available".
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel master: that could stop a publish half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src --deny-warnings
      - run: npx tsc -b
      - run: npx vite build

  addon:
    name: Add-on config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./addon

  version:
    name: Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' backend/Cargo.toml)
          npm=$(jq -r .version frontend/package.json)
          if [ "$version" != "$cargo" ] || [ "$version" != "$npm" ]; then
            echo "::error::versions differ: add-on $version, backend $cargo, frontend $npm"; exit 1
          fi

  release-build:
    name: Release build check
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Both architectures build; the amd64 image is built and smoke-tested.
      - run: make addon ARCH=aarch64
      - run: make addon ARCH=amd64
      - run: make image ARCH=amd64
      - name: Smoke-test the image
        run: |
          docker run -d --name ergo -e ERGO_HA_TOKEN=none -e SUPERVISOR_TOKEN=none ergo-addon:amd64
          for i in $(seq 1 20); do
            if docker exec ergo wget -qO- http://127.0.0.1:8099/health | grep -q ok; then
              echo "health ok"; docker exec ergo wget -qO- http://127.0.0.1:8099/ | grep -q '<div id="root">' && echo "ui ok" && exit 0
            fi
            sleep 1
          done
          docker logs ergo; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: ergo-aarch64
          path: build/addon-aarch64/bin/ergo-aarch64
          retention-days: 14

  release-commit:
    name: Release commit
    needs: [version, addon, release-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: release
        run: |
          # Everything since the last release; #minor or #major in any commit
          # message picks that bump, otherwise patch. The first release is minor.
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${last:+"$last"..}HEAD
          if [ -z "$last" ]; then bump=minor; else bump=patch; fi
          if git log --format=%B $range | grep -q '#major'; then bump=major
          elif git log --format=%B $range | grep -q '#minor'; then bump=minor; fi
          git log --no-merges --format='- %s' $range \
            | grep -v '^- Release [0-9]' > "$RUNNER_TEMP/notes.md" || echo "- Maintenance" > "$RUNNER_TEMP/notes.md"
          CHANGELOG_NOTES="$RUNNER_TEMP/notes.md" dev/bump-version.sh "$bump"
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend frontend addon
          git commit -m "Release $version" -m "[skip ci]"
          # Fails if master moved on meanwhile; that newer run releases instead.
          git push origin HEAD:master
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  image:
    name: Publish image (${{ matrix.arch }})
    needs: release-commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-commit.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make addon ARCH=${{ matrix.arch }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-addon-ergo" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: build/addon-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.release-commit.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ needs.release-commit.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  github-release:
    name: Tag and release
    needs: [release-commit, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-commit.outputs.sha }}
      - name: Release notes from the changelog
        run: |
          awk -v v="## ${{ needs.release-commit.outputs.version }}" '$0==v{f=1;next} /^## /{f=0} f' addon/CHANGELOG.md > notes.md
      # Tags the release commit; only after both images are pushed, so a failed
      # publish leaves the version untagged and the next master push retries it.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release-commit.outputs.version }}
          target_commitish: ${{ needs.release-commit.outputs.sha }}
          body_path: notes.md
