name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src --deny-warnings
      - run: npx tsc -b
      - run: npx vite build

  addon:
    name: Add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./addon

  release-build:
    name: Release build check
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Both architectures build; the amd64 image is built and smoke-tested.
      - run: make addon ARCH=aarch64
      - run: make addon ARCH=amd64
      - run: make image ARCH=amd64
      - name: Smoke-test the image
        run: |
          docker run -d --name ergo -e ERGO_HA_TOKEN=none ergo-addon:amd64
          for i in $(seq 1 20); do
            if docker exec ergo wget -qO- http://127.0.0.1:8099/health | grep -q ok; then
              echo "health ok"; docker exec ergo wget -qO- http://127.0.0.1:8099/ | grep -q '<div id="root">' && echo "ui ok" && exit 0
            fi
            sleep 1
          done
          docker logs ergo; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ergo-aarch64
          path: build/addon-aarch64/bin/ergo-aarch64
          retention-days: 14
