name: CI

# Pull requests are checked and built (incl. the image smoke test) with nothing
# pushed, tagged or released.
#
# A push to master first works out the next version (patch, or #minor / #major
# in a commit message since the last release) and stamps it into every
# component with dev/bump-version.sh before building, so the binaries, the UI
# and both add-on images carry it. Only once the images are pushed does the
# last job commit the bump ("Release X.Y.Z [skip ci]"), tag it vX.Y.Z and
# publish the GitHub release, so tag, images and release always match. A run
# that fails before that leaves master untouched, and the next push retries
# the same number.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Master runs queue rather than cancel: two quick pushes can't claim the same
  # version, and a publish is never stopped half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src --deny-warnings
      - run: npx tsc -b
      - run: npx vite build

  addon:
    name: Add-on config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./addon

  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Components agree on the version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' backend/Cargo.toml)
          npm=$(jq -r .version frontend/package.json)
          if [ "$version" != "$cargo" ] || [ "$version" != "$npm" ]; then
            echo "::error::versions differ: add-on $version, backend $cargo, frontend $npm"; exit 1
          fi
      - name: Work out the next version
        id: next
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          # The add-on config holds the last released version: a bump only
          # reaches master once that version is fully published.
          current=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)
          if [ "$(git rev-parse -q --verify "refs/tags/v$current^{commit}" || true)" = "$(git rev-parse HEAD)" ]; then
            echo "Nothing new since v$current."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          IFS=. read -r major minor patch <<< "$current"
          log=$(git log --format=%B "$range")
          if grep -q '#major' <<< "$log"; then next="$((major + 1)).0.0"
          elif grep -q '#minor' <<< "$log"; then next="$major.$((minor + 1)).0"
          else next="$major.$minor.$((patch + 1))"; fi
          notes=$(git log --no-merges --format='- %s' "$range" | grep -v '^- Release [0-9]' || true)
          [ -n "$notes" ] || notes="- Maintenance"
          echo "Next version: $next (from $current, last tag ${last:-none})"
          {
            echo "release=true"
            echo "version=$next"
            echo "notes<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  release-build:
    name: Release build check
    needs: [version, backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Stamp the new version
        if: needs.version.outputs.release == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          CHANGELOG_NOTES="$RUNNER_TEMP/notes.md" dev/bump-version.sh "$VERSION"
      # Both architectures build; the amd64 image is built and smoke-tested.
      - run: make addon ARCH=aarch64
      - run: make addon ARCH=amd64
      - run: make image ARCH=amd64
      - name: Smoke-test the image
        run: |
          docker run -d --name ergo -e ERGO_HA_TOKEN=none -e SUPERVISOR_TOKEN=none ergo-addon:amd64
          for i in $(seq 1 20); do
            if docker exec ergo wget -qO- http://127.0.0.1:8099/health | grep -q ok; then
              echo "health ok"; docker exec ergo wget -qO- http://127.0.0.1:8099/ | grep -q '<div id="root">' && echo "ui ok" && exit 0
            fi
            sleep 1
          done
          docker logs ergo; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: ergo-aarch64
          path: build/addon-aarch64/bin/ergo-aarch64
          retention-days: 14

  image:
    name: Publish image (${{ matrix.arch }})
    needs: [version, addon, release-build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Stamp the new version
        if: needs.version.outputs.release == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          CHANGELOG_NOTES="$RUNNER_TEMP/notes.md" dev/bump-version.sh "$VERSION"
      - run: make addon ARCH=${{ matrix.arch }} DEV_VERSION=${{ needs.version.outputs.version }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-addon-ergo" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: build/addon-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  release:
    name: Release
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Stamp the new version
        if: needs.version.outputs.release == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          CHANGELOG_NOTES="$RUNNER_TEMP/notes.md" dev/bump-version.sh "$VERSION"
      # The bump commit sits on top of exactly the code that was built and goes
      # up with its tag in one atomic push. Pushes made with GITHUB_TOKEN don't
      # start another run, and [skip ci] makes sure of it.
      - name: Commit the version and tag it
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend frontend addon
          git status --short
          git commit -m "Release $VERSION" -m "[skip ci]"
          git tag -a "v$VERSION" -m "Release $VERSION"
          if ! git push --atomic origin HEAD:master "refs/tags/v$VERSION"; then
            # Someone pushed to master meanwhile. Tag what was built anyway;
            # that newer push's run puts the next version on master.
            echo "::warning::master moved on during the release; v$VERSION is tagged but its commit isn't on master."
            git push origin "refs/tags/v$VERSION"
          fi
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' addon/CHANGELOG.md > notes.md
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md
