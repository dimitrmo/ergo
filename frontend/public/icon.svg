<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- The ergo mark: "ergo" means "therefore", and the therefore sign (∴) is
       three dots. Here the dots are a tiny workflow: a trigger (solid, lower
       left) flows up into a step (solid, top) and on to an output (open ring,
       lower right). Same treatment as the phirepass mark (neon sweep on a
       near-black body, bloom, lit edge), rotated into ergo's amber. -->
  <defs>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="8" y1="41" x2="40" y2="9">
      <stop offset="0%" stop-color="hsl(18 96% 54%)" />
      <stop offset="35%" stop-color="hsl(30 98% 55%)" />
      <stop offset="70%" stop-color="hsl(41 100% 55%)" />
      <stop offset="100%" stop-color="hsl(52 100% 64%)" />
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(28 30% 13%)" />
      <stop offset="50%" stop-color="hsl(34 32% 9%)" />
      <stop offset="100%" stop-color="hsl(42 36% 7%)" />
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="34%" r="60%">
      <stop offset="0%" stop-color="hsl(41 100% 55%)" stop-opacity="0.34" />
      <stop offset="100%" stop-color="hsl(41 100% 55%)" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="hsl(18 96% 54%)" stop-opacity="0.8" />
      <stop offset="100%" stop-color="hsl(52 100% 64%)" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#body)" />
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#bloom)" />
  <rect x="1" y="1" width="46" height="46" rx="12" fill="none" stroke="url(#edge)" stroke-width="1.8" />

  <!-- The flow: trigger -> step -> output, one direction. -->
  <path d="M13 33.5 C 13.6 25.2, 17.4 17.6, 24 14.5 C 30.2 17.2, 34 23.4, 34.8 28.9"
        fill="none" stroke="url(#mark)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Trigger and step: solid. -->
  <circle cx="13" cy="33.5" r="3.8" fill="url(#mark)" />
  <circle cx="24" cy="14.5" r="3.8" fill="url(#mark)" />
  <!-- Output: open. -->
  <circle cx="35" cy="33.2" r="4.1" fill="none" stroke="url(#mark)" stroke-width="2.4" />
</svg>
